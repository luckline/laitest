<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>铭测商业管理</title><link rel="icon" href="/img/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/css/lingtest-admin.css?v=1"></head><body><header><a href="/lingtest"><i>铭</i><span><b>铭测商业管理</b><small>LEADS & ENTITLEMENTS</small></span></a><button id="logout" hidden>退出管理</button></header><main><section id="loginPanel" class="login-panel"><p>ADMIN ACCESS</p><h1>管理员登录</h1><span>输入服务器配置的独立管理 Token。凭证仅保存在当前标签页。</span><form id="loginForm"><input id="adminToken" type="password" autocomplete="current-password" placeholder="LINGTEST_ADMIN_TOKEN" required><button>进入管理后台</button></form><div id="loginMessage" role="alert"></div></section><section id="adminPanel" hidden><div class="admin-head"><div><p>COMMERCIAL PIPELINE</p><h1>专业版申请</h1><span>审核申请、记录联系进度并生成一次性激活码。</span></div><div><select id="statusFilter"><option value="">全部状态</option><option value="new">待处理</option><option value="contacted">已联系</option><option value="approved">已通过</option><option value="active">已激活</option><option value="rejected">已拒绝</option></select><button id="refresh">刷新</button></div></div><div id="summary" class="summary"></div><div id="leadList" class="lead-list"></div></section></main><dialog id="codeDialog"><div><button id="closeCode" aria-label="关闭">×</button><p>ACTIVATION CODE</p><h2>申请已通过</h2><span>将激活码发送给用户。激活码一次性使用，24 小时后过期。</span><strong id="activationCode"></strong><button id="copyCode">复制激活码</button></div></dialog><script src="/lingtest-admin.js?v=1"></script></body></html>
